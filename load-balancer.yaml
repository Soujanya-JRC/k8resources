kind: Service
apiVersion: v1
metadata:
  name: nginx-lb
spec:
  type: LoadBalancer
  selector: # labels are used as selectors
    project : expense
    component : backend
    environmnet: dev 
    version: "1.0.0"
    demo: np
  ports:
  - protocol: TCP
    port: 80 #service port
    targetPort: 80 
    nodePort: 30007
  
---
kind: Pod
apiVersion: v1
metadata:
  name: backend-lb
  labels:
    project : expense
    component : backend
    environmnet: dev 
    version: "1.0.0"
    demo: np
spec:
  containers:
  - name: nginx
    image: nginx
